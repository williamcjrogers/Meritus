[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meritus"
version = "0.1.0"
description = "Evidence-led construction claims signal engine"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "lxml>=6,<7",
    "odfpy>=1.4,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "sqlalchemy>=2.0,<3",
    "typer>=0.17,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
meritus = "meritus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meritus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
